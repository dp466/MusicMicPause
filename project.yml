name: MicPause
options:
  bundleIdPrefix: com.dparadis
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QU4R4G95KN
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MicPause:
    type: application
    platform: macOS
    sources:
      - path: MicPause
        excludes:
          - Info.plist
          - MicPause.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dparadis.MicPause
        PRODUCT_NAME: MicPause
        INFOPLIST_FILE: MicPause/Info.plist
        CODE_SIGN_ENTITLEMENTS: MicPause/MicPause.entitlements
        # Meeting microphone control uses the user-approved Accessibility API.
        # Apple documents assistive Accessibility access as incompatible with
        # App Sandbox, so this direct-distribution build keeps Hardened Runtime
        # but is intentionally not Mac App Store sandboxed.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: ServiceManagement.framework
      - sdk: Carbon.framework
  MicPauseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MicPauseTests
    dependencies:
      - target: MicPause
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dparadis.MicPauseTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MicPause:
    build:
      targets:
        MicPause: all
        MicPauseTests: [test]
      postActions:
        # A scheme post-action runs after code signing; a target build phase
        # would copy the bundle before it is signed.
        - name: Install to /Applications
          settingsTarget: MicPause
          script: '"$SRCROOT/script/install_to_applications.sh"'
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MicPauseTests
