name: MicPauseScreenshotHarness
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  MicPauseScreenshotHarness:
    type: application
    platform: macOS
    sources:
      - path: ../../MicPause
        excludes:
          - App/MicPauseApp.swift
          - Info.plist
          - MicPause.entitlements
      - path: ScreenshotHarnessApp.swift
    settings:
      base:
        # A test executable must not share the production menu-bar host identity.
        PRODUCT_BUNDLE_IDENTIFIER: com.dparadis.MicPause.ScreenshotHarness
        PRODUCT_NAME: MicPauseScreenshotHarness
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ../../AppStore/ScreenshotHarness/Info.plist
        ENABLE_APP_SANDBOX: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: ServiceManagement.framework
      - sdk: Carbon.framework
