name: MicPause
options:
  bundleIdPrefix: com.dparadis
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MicPause:
    type: application
    platform: macOS
    sources:
      - path: MicPause
        excludes:
          - Info.plist
          - MicPause.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dparadis.MicPause
        PRODUCT_NAME: MicPause
        INFOPLIST_FILE: MicPause/Info.plist
        CODE_SIGN_ENTITLEMENTS: MicPause/MicPause.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: ServiceManagement.framework
      - sdk: Carbon.framework
  MicPauseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MicPauseTests
    dependencies:
      - target: MicPause
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dparadis.MicPauseTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  MicPause:
    build:
      targets:
        MicPause: all
        MicPauseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MicPauseTests
