<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Mic Pause — Quiet music. Clear conversations.</title>
  <desc id="desc">A native Mac menu-bar app for Apple Music. A turquoise microphone and pause mark on a dark blue and green background.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1320"/><stop offset="1" stop-color="#102d32"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#39ded0" stop-opacity=".15"/><stop offset="1" stop-color="#39ded0" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x2=".8" y2="1"><stop stop-color="#79fff0"/><stop offset="1" stop-color="#27c6c6"/></linearGradient>
    <mask id="cutouts"><rect width="100" height="100" fill="white"/><rect x="39.7" y="17" width="7.8" height="29" rx="2.34" fill="black"/><rect x="52.5" y="17" width="7.8" height="29" rx="2.34" fill="black"/></mask>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="190" r="310" fill="url(#glow)"/>
  <g fill="none" stroke="#72e9de" stroke-opacity=".12"><circle cx="1060" cy="200" r="138"/><circle cx="1060" cy="200" r="176"/><circle cx="1060" cy="200" r="218"/></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="83" fill="#78e6da" font-size="15" font-weight="600" letter-spacing="3">MADE FOR YOUR MAC</text>
    <text x="66" y="176" fill="#f2fbfc" font-size="78" font-weight="700" letter-spacing="-3">Mic Pause</text>
    <text x="70" y="239" fill="#d4e7e9" font-size="30" font-weight="400">Quiet music. Clear conversations.</text>
    <text x="70" y="314" fill="#90adb5" font-size="20">Your microphone starts. Apple Music pauses.</text>
    <text x="70" y="345" fill="#90adb5" font-size="20">You finish. Your music comes back.</text>
  </g>
  <!-- Geometry matches MicPause/Views/MicPauseMark.swift. -->
  <g transform="translate(960 100) scale(2)" fill="url(#mark)">
    <rect x="32" y="6" width="36" height="51" rx="18" mask="url(#cutouts)"/>
    <path d="M75.8 44.5 A25.8 25.8 0 0 1 24.2 44.5" fill="none" stroke="#47ddd2" stroke-width="8.8" stroke-linecap="round"/>
    <rect x="45.6" y="69" width="8.8" height="20" rx="4.4"/>
    <rect x="32.5" y="85.6" width="35" height="8.8" rx="4.4"/>
  </g>
</svg>
